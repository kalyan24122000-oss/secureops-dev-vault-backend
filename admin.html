<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - SecureOps Vault</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #060d19; color: #e2e8f0; margin: 0; padding: 20px; }
    #login-screen, #dashboard { display: none; }
    #login-screen.active, #dashboard.active { display: block; }
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: #111d35; padding: 20px; border-radius: 12px; border: 1px solid #1a2a48; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h2 { color: #2dd4bf; margin-top: 0; border-bottom: 1px solid #1a2a48; padding-bottom: 10px; }
    input[type="password"], input[type="text"] { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; background: #0d1628; border: 1px solid #1a2a48; color: #fff; border-radius: 6px; font-family: monospace; }
    button { padding: 10px 20px; background: linear-gradient(135deg, #2dd4bf, #6366f1); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    th, td { padding: 12px; border-bottom: 1px solid #1a2a48; text-align: left; }
    th { color: #818cf8; text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
    tr:hover { background: #0d1628; }
    .badge { padding: 4px 8px; border-radius: 4px; background: #1e293b; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    pre { background: #0d1628; padding: 15px; border-radius: 6px; overflow-x: auto; color: #a855f7; border: 1px solid #1a2a48; font-size: 13px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .hash-text { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #64748b; }
    .key-text { color: #ef4444; font-family: monospace; max-width: 250px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-screen" class="active card" style="max-width: 400px; margin: 100px auto; text-align: center;">
      <h2>🛡️ Admin Login</h2>
      <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">SecureOps Dev Vault Admin Panel</p>
      <input type="password" id="admin-pass" placeholder="Enter Admin Password">
      <button id="btn-login" style="width: 100%;">Access Panel</button>
    </div>

    <div id="dashboard" class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>👥 Users List</h2>
        <button id="btn-refresh">Refresh Data</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Email</th>
              <th>Password Hash</th>
              <th>Private Key</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>

      <hr style="border-color:#1a2a48; margin: 40px 0;">

      <h2>🔓 Decryption Panel</h2>
      <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Use this to recover a user's vault data if they lost their account access.</p>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="decrypt-user-id" placeholder="User ID">
        <input type="text" id="decrypt-private-key" placeholder="Private Key (Secret)">
      </div>
      <button id="btn-decrypt">Decrypt & View Vault Data</button>
      
      <div id="decrypted-results" style="margin-top: 30px;"></div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
