services:
  postgres:
    image: postgres:16
    container_name: secureops-vault-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secureops_vault
    ports:
      - "5432:5432"
    volumes:
      - secureops_pg_data:/var/lib/postgresql/data

volumes:
  secureops_pg_data:
